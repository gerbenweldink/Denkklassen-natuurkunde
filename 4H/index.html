<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>4H | Natuurkunde</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: linear-gradient(135deg, #172554, #2563eb);
      color: white;
      padding: 50px 20px;
    }

    .container {
      max-width: 1050px;
      margin: auto;
    }

    .label {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    h1 {
      font-size: 56px;
      margin: 10px 0;
    }

    .intro {
      font-size: 20px;
      max-width: 700px;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    .title {
      font-size: 26px;
      margin-bottom: 18px;
    }

    .card {
      display: block;
      max-width: 650px;
      background: white;
      border: 1px solid #dbe3ec;
      border-radius: 20px;
      padding: 28px;
      text-decoration: none;
      color: #172033;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.15);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
      margin: 0 0 10px;
    }

    .description {
      color: #64748b;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 11px 17px;
      border-radius: 10px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <div class="label">Natuurkunde · 4H</div>

      <h1>Beweging</h1>

      <div class="intro">
        Kies hieronder een opdracht en ga zelf aan de slag met
        bewegingen en diagrammen.
      </div>
    </div>
  </header>

  <main>

    <div class="title">
      Opdrachten
    </div>

    <a class="card" href="diagrammen.html">

      <div class="icon">📈</div>

      <h2>a-t, v-t en x-t diagrammen</h2>

      <div class="description">
        Oefen met het omzetten en interpreteren van
        a-t-, v-t- en x-t-diagrammen.
      </div>

      <span class="button">
        Start opdracht →
      </span>

    </a>

  </main>

  <footer>
    4H · Denkklassen Natuurkunde
  </footer>

</body>
</html>
