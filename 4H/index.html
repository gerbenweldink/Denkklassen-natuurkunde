<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4H | Natuurkunde</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f7fb;
  color:#172033;
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
header{
  background:linear-gradient(135deg,#172554,#2563eb);
  color:white;
  padding:46px 20px 52px;
}
.wrap{max-width:1050px;margin:auto}
.eyebrow{
  font-size:13px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;opacity:.8;margin-bottom:10px
}
h1{font-size:clamp(40px,7vw,58px);line-height:1.05;margin:0}
.intro{font-size:19px;max-width:720px;margin:14px 0 0;opacity:.94}
main{padding:34px 20px 70px}
.section-title{font-size:22px;margin:0 0 16px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}
.card{
  display:block;
  background:#fff;
  border:1px solid #dbe3ec;
  border-radius:20px;
  padding:25px;
  color:inherit;
  text-decoration:none;
  box-shadow:0 8px 28px rgba(15,23,42,.07);
  transition:transform .15s,box-shadow .15s;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 35px rgba(15,23,42,.13);
}
.icon{font-size:38px;margin-bottom:12px}
h2{font-size:25px;margin:0 0 8px}
.card p{color:#64748b;font-size:16px;margin:0 0 20px}
.button{
  display:inline-block;background:#2563eb;color:#fff;
  padding:10px 15px;border-radius:10px;font-weight:800
}
footer{
  text-align:center;color:#64748b;font-size:14px;padding:0 20px 35px
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Natuurkunde · 4H</div>
    <h1>Beweging</h1>
    <p class="intro">Kies hieronder een opdracht en ga zelf aan de slag met de bewegingen en diagrammen.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <h2 class="section-title">Opdrachten</h2>
    <div class="grid">
      <a class="card" href="diagrammen.html">
        <div class="icon">📈</div>
        <h2>a-t, v-t en x-t diagrammen</h2>
        <p>Oefen met het omzetten en interpreteren van a-t-, v-t- en x-t-diagrammen.</p>
        <span class="button">Start opdracht →</span>
      </a>
    </div>
  </div>
</main>

<footer>4H · Denkklassen Natuurkunde</footer>
</body>
</html>
